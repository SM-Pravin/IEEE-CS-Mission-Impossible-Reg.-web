<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef2b20"/>
      <stop offset="100%" stop-color="#b70e0a"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="14" fill="#0b0707"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <!-- Crosshair elements -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ef2b20" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="32" y1="6" x2="32" y2="12" stroke="#ef2b20" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="58" stroke="#ef2b20" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="12" y2="32" stroke="#ef2b20" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="58" y2="32" stroke="#ef2b20" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Central M:I stylized stencil icon -->
  <text x="32" y="40" font-family="'Chakra Petch', 'Impact', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">M:I</text>
  <circle cx="32" cy="32" r="2" fill="#ef2b20"/>
</svg>
